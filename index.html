<script>
const $=id=>document.getElementById(id),sc=$('scene'),F=$('frog'),FI=$('fi'),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];

function el(t,c,h){const e=document.createElement(t);e.className=c;if(h)e.textContent=h;return e}
/* ---- sound ---- */
let AC;function ac(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state=='suspended')AC.resume();return AC}
function tone(f,t,d,ty,v,f2){const a=ac();if(!a||!soundOn)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d+.05)}
function noise(d){const a=ac();if(!a||!soundOn)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=1800;g.gain.value=.5;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start()}
const sfx={jump:()=>tone(280,0,.25,'sine',.25,750),splash:()=>{noise(.5);tone(420,0,.3,'triangle',.12,90)},ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.25,'triangle',.22)),win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.35,'triangle',.25)),land:()=>tone(140,0,.12,'sine',.3,55),pop:()=>{noise(.1);tone(1000,0,.07,'square',.08,300)}};

/* ---- scene ---- */
const pads=[];
let at=0;
const NS='http://www.w3.org/2000/svg',FF='Amiri,"Noto Naskh Arabic","Traditional Arabic",serif',cv=document.createElement('canvas').getContext('2d'),fitC=new Map();
function mkLabel(){const v=document.createElementNS(NS,'svg');v.setAttribute('viewBox','0 0 100 62');v.setAttribute('class','l');v.append(document.createElementNS(NS,'text'));v.firstChild.setAttribute('text-anchor','middle');return v}
/* measure the real ink box of the word (including harakat) and scale it to fill the pad's ellipse, centred */
function fitText(t){if(fitC.has(t))return fitC.get(t);cv.font=`700 100px ${FF}`;cv.textAlign='center';const m=cv.measureText(t),abl=m.actualBoundingBoxLeft||0,abr=m.actualBoundingBoxRight||0,asc=m.actualBoundingBoxAscent||0,dsc=m.actualBoundingBoxDescent||0;
let w=abl+abr,h=asc+dsc;if(!(w>0&&h>0)){w=m.width||60;h=90}
const u=Math.min(.68,.84/Math.hypot(w/100,h/62)),r={f:100*u,x:50-((abr-abl)/2)*u,y:30.5+((asc-dsc)/2)*u};fitC.set(t,r);return r}
function buildPads(n){pads.forEach(p=>p.remove());pads.length=0;
const W=sc.clientWidth||1000,Hh=sc.clientHeight||500,xa=18,xb=82,xs=n==1?[50]:Array.from({length:n},(_,i)=>xa+(xb-xa)*i/(n-1)),sp=n==1?40:(xb-xa)/(n-1);
let pwc=Math.min(n==1?17:1.9*sp,17);pwc=Math.min(pwc,.4*Hh/W*100);
const pwp=pwc*W/100,h=.62*pwp,lowB=.05*Hh,high=lowB+Math.min(Math.max(h+.03*Hh,.26*Hh),.62*Hh-lowB-h),zig=n>1&&pwc>sp*.92,
ys=xs.map((_,i)=>(zig?(i%2==0?high:lowB):(lowB+high)/2)/Hh*100),bankY=(ys[0]/100*Hh+.25*pwp)/Hh*100;
PX=[8,...xs,92];PY=[bankY,...ys,bankY];PK=[0,...xs.map(()=>.25),0];
sc.style.setProperty('--pw',pwc.toFixed(2)+'cqw');sc.style.setProperty('--bh',(bankY+.06*pwp/Hh*100+1.2).toFixed(1)+'%');
xs.forEach((x,i)=>{const p=el('div','pad');p.style.left=x+'%';p.style.bottom=ys[i]+'%';p.append(mkLabel());sc.append(p);pads.push(p)})}
[['🌸',2,47],['🌼',8,49],['🌷',11,46],['🌼',87,48],['🌸',92,47],['🌷',96,49]].forEach(([e,x,y])=>{const f=el('i','fl',e);f.style.left=x+'%';f.style.bottom=y+'%';sc.append(f)});
[['🦋',15,60],['🦋',55,70],['🦋',75,55]].forEach(([e,x,y],i)=>{const f=el('i','bf',e);f.style.left=x+'%';f.style.bottom=y+'%';f.style.animationDelay=-i*3+'s';sc.append(f)});
setInterval(()=>{if(document.hidden)return;const b=el('i','bub'),s=6+rnd(10);b.style.cssText=`left:${rnd(100)}%;bottom:${rnd(40)}%;width:${s}px;height:${s}px`;$('water').append(b);setTimeout(()=>b.remove(),3600)},600);
function put(x,y,k){F.style.left=x+'%';F.style.bottom=`calc(${y}% + var(--pw)*${k})`}
function stop(i){at=i;put(PX[i],PY[i],PK[i])}
/* ---- frog: expressions, pose, leap ---- */
function mood(m){const M={happy:['M185 86 C168 94 146 92 128 84','none',5.4,2.9,0],surprised:['M184 86 C178 101 160 101 152 90 C164 92 176 90 184 86Z','#6b1c26',5,4.6,0],excited:['M185 85 C168 93 146 92 128 83 C140 110 176 110 185 85Z','#7a1f2b',5.6,1.7,1]}[m];
$('mo').setAttribute('d',M[0]);$('mo').setAttribute('fill',M[1]);['p1','p2'].forEach(i=>{$(i).setAttribute('rx',M[2]);$(i).setAttribute('ry',M[3])});$('tg').setAttribute('opacity',M[4])}
const REST={th:0,sh:0,ft:0,arm:0,pt:0,sx:1,sy:1};
const KF=[[0,0,0,0,0,0,1,1],[.16,-10,14,-8,-8,-4,1.05,.88],[.30,106,-145,150,35,-26,.94,1.12],[.46,140,-145,152,62,-20,.97,1.06],[.62,151,-145,155,75,-4,1,1.02],[.78,125,-120,135,-25,14,1,1],[.90,55,-60,60,-18,6,1.07,.92],[1,0,0,0,0,0,1,1]];
function poseAt(t){let i=0;while(i<KF.length-2&&t>=KF[i+1][0])i++;const a=KF[i],b=KF[i+1],u=Math.max(0,Math.min(1,(t-a[0])/(b[0]-a[0]))),e=u*u*(3-2*u),L=k=>a[k]+(b[k]-a[k])*e;
return{th:L(1),sh:L(2),ft:L(3),arm:L(4),pt:L(5),sx:L(6),sy:L(7)}}
function applyPose(p){$('thg').setAttribute('transform',`rotate(${p.th} 68 98)`);$('shn').setAttribute('transform',`rotate(${p.sh} 110 108)`);$('fot').setAttribute('transform',`rotate(${p.ft} 56 124)`);$('frl').setAttribute('transform',`rotate(${p.arm} 118 101)`)}
function restPose(){applyPose(REST);FI.style.transform='';const h=$('shd');h.style.opacity='';h.style.transform=''}
function leap(fx,fy,fk,tx,ty,tk,dur,o={}){return new Promise(res=>{const H=(o.h||.22)*sc.clientHeight,t0=performance.now(),fall=!!o.fall;
(function fr(now){const t=Math.max(0,Math.min(1,(now-t0)/dur)),tt=fall?t*.9:t,p=poseAt(tt),s=Math.max(0,Math.min(1,(tt-.3)/.6)),arc=4*s*(1-s),
x=fx+(tx-fx)*s,y=fy+(ty-fy)*s,k=fk+(tk-fk)*s,fl=o.flip?-360*s*s*(3-2*s):0;
F.style.left=x+'%';F.style.bottom=`calc(${y}% + var(--pw)*${k})`;applyPose(p);
FI.style.transform=`translateY(${-arc*H}px) rotate(${p.pt+fl}deg) scale(${p.sx},${p.sy})`;
const h=$('shd');h.style.transform=`scale(${1-.4*arc})`;h.style.opacity=1-.5*arc;
if(t<1)requestAnimationFrame(fr);else{if(!fall)restPose();res()}})(t0)})}
function ripple(i){if(i<1||i>N)return;const r=el('div','rip');r.style.left=PX[i]+'%';r.style.bottom=`calc(${PY[i]}% + var(--pw)*.1)`;sc.append(r);setTimeout(()=>r.remove(),1000)}
(function blinkLoop(){setTimeout(()=>{if(!F.classList.contains('hid')&&!document.hidden)$('lid').animate([{transform:'scaleY(0)'},{transform:'scaleY(1)',offset:.45},{transform:'scaleY(0)'}],{duration:230});blinkLoop()},2200+rnd(3500))})();
/* ---- party: balloons + confetti ---- */
const party=document.createElement('div');party.id='party';document.body.append(party);
const BC=['#ef4444','#f59e0b','#facc15','#22c55e','#3b82f6','#a855f7','#ec4899','#14b8a6'];let partyT=null,partyT2=null;
function confetti(n,x0,y0){for(let i=0;i<n;i++){const c=el('div','cf'),w=6+rnd(6),h=10+rnd(9),dur=2600+rnd(2600),dx=rnd(160)-80,fall=innerHeight+60;
c.style.cssText=`left:${rnd(innerWidth)}px;width:${w}px;height:${h}px;background:${pick(BC)}`;party.append(c);
c.animate([{transform:'translate(0,0) rotate(0) scaleX(1)'},{transform:`translate(${dx/2}px,${fall/2}px) rotate(${360+rnd(360)}deg) scaleX(.3)`,offset:.5},{transform:`translate(${dx}px,${fall}px) rotate(${720+rnd(360)}deg) scaleX(1)`}],{duration:dur,easing:'ease-in',delay:rnd(400)}).onfinish=()=>c.remove()}}
function sparkle(x,y){for(let i=0;i<16;i++){const c=el('div','cf'),a=i/16*6.283,d=50+rnd(60);c.style.cssText=`left:${x}px;top:${y}px;width:8px;height:8px;border-radius:50%;background:${pick(BC)}`;party.append(c);
c.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+20}px) scale(.2)`,opacity:0}],{duration:600+rnd(300),easing:'ease-out'}).onfinish=()=>c.remove()}}
function balloon(){const w=46+rnd(30),c=pick(BC),b=el('div','balloon'),sw=rnd(120)-60,H=innerHeight+260;b.style.cssText=`left:${rnd(Math.max(1,innerWidth-w))}px;width:${w}px`;
b.innerHTML=`<svg viewBox="0 0 50 90"><path d="M25 2 C8 2 2 20 4 34 C6 48 17 58 25 60 C33 58 44 48 46 34 C48 20 42 2 25 2Z" fill="${c}"/><path d="M25 60 C33 58 44 48 46 34 C40 43 32 51 25 60Z" fill="#000" opacity=".16"/><ellipse cx="16" cy="17" rx="5.5" ry="10" transform="rotate(-25 16 17)" fill="#fff" opacity=".4"/><path d="M25 60 L20.5 67 L29.5 67Z" fill="${c}"/><path d="M25 67 C19 74 31 80 25 90" stroke="#666" stroke-width="1.2" fill="none"/></svg>`;
party.append(b);const an=b.animate([{transform:'translate(0,0) rotate(-4deg)'},{transform:`translate(${sw}px,${-H/2}px) rotate(5deg)`,offset:.5},{transform:`translate(${-sw/2}px,${-H}px) rotate(-4deg)`}],{duration:6500+rnd(4500),easing:'linear'});an.onfinish=()=>b.remove();
b.onpointerdown=()=>{const r=b.getBoundingClientRect();sfx.pop();sparkle(r.left+r.width/2,r.top+r.height*.35);b.remove()}}
function startParty(){stopParty();balloon();balloon();balloon();partyT=setInterval(()=>{if(!document.hidden){balloon();if(Math.random()<.6)balloon()}},650);partyT2=setInterval(()=>{if(!document.hidden)confetti(22)},1600)}
function stopParty(){clearInterval(partyT);clearInterval(partyT2);party.textContent=''}
function say(t,b){const m=$('msg');m.textContent=t;m.className=(b?'bad ':'')+'show';m.style.animation='none';m.offsetWidth;m.style.animation='';clearTimeout(mt);mt=setTimeout(()=>m.className=b?'bad':'',3200)}
function fly(e,x,y,dx,dy,d){const s=el('b','fx',e);s.style.left=x+'%';s.style.bottom=y+'%';sc.append(s);s.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx/2}px,${dy}px) rotate(180deg)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy+90}px) rotate(360deg)`,opacity:0}],{duration:d,easing:'ease-out'}).onfinish=()=>s.remove()}
function burst(n){for(let i=0;i<n;i++)fly(pick(['⭐','✨','🎉','🌟']),30+rnd(40),45+rnd(20),(Math.random()-.5)*400,-60-rnd(120),1200+rnd(600))}
function splash(x,y){for(let i=0;i<9;i++)fly('💧',x,y,(Math.random()-.5)*220,-50-rnd(90),900);const r=el('div','ring');r.style.left=x+'%';r.style.bottom=y+'%';sc.append(r);setTimeout(()=>r.remove(),950)}
/* ---- state / render ---- */
const len=t=>Array.from(String(t).replace(/[\p{M}\u0640]/gu,'')).length||1;
function render(){pads.forEach((p,i)=>{const d=i<pos,c=i==pos&&playing,t=d||c?order[i]:'',s=p.firstChild;p.classList.toggle('done',d);p.classList.toggle('cur',c);const tx=s.firstChild;tx.textContent=t;if(t){const f=fitText(t);tx.setAttribute('x',f.x.toFixed(2));tx.setAttribute('y',f.y.toFixed(2));tx.setAttribute('font-size',f.f.toFixed(2))}});
const cu=playing&&pos<N?order[pos]:'–',cl=$('cl');cl.textContent=cu;cl.style.setProperty('font-size',Math.max(13,Math.min(22,Math.floor(80/len(cu))))+'px','important');
$('sc').textContent=ok;$('sw').textContent=bad;$('sd').textContent=pos+' / '+N;$('bar').style.width=pos/N*100+'%';$('ss').textContent='⭐'.repeat(Math.floor(sessOk/5))||'—'}
function ctrls(){['bc','bw'].forEach(i=>$(i).disabled=busy||paused||!playing)}
function hideZoom(){$('zoom').hidden=true;clearTimeout(zt)}
async function run(fn){if(busy||paused||!playing)return;busy=true;ctrls();hideZoom();try{await fn()}finally{busy=false;ctrls()}}
function makeDeck(){const mk=()=>cur.shuf?shuffle(POOL):[...POOL];let d=mk();if(d.length>=cur.per)return d.slice(0,cur.per);
while(d.length<cur.per){const c=mk();if(c.length>1&&c[0]==d[d.length-1])c.push(c.shift());d.push(...c)}return d.slice(0,cur.per)}
function newRound(){stopParty();restPose();started=true;order=makeDeck();N=order.length;buildPads(N);pos=0;ok=0;bad=0;playing=true;busy=false;paused=false;hideZoom();['pause','win','welcome'].forEach(i=>$(i).classList.add('hide'));
F.style.transition='none';stop(0);F.offsetWidth;F.style.transition='';F.classList.remove('hid');FI.animate([{transform:'scale(0)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:500});mood('happy');render();ctrls();say('Read what’s on the lily pad!')}
/* ---- actions ---- */
async function hop(i,o){const a=i-1;setTimeout(sfx.jump,230);await leap(PX[a],PY[a],PK[a],PX[i],PY[i],PK[i],840,o);at=i;sfx.land();ripple(i)}
async function onCorrect(){ok++;sessOk++;await hop(pos+1);pos++;mood('happy');sfx.ok();burst(10);
if(sessOk%5==0){say('⭐ A new star! Amazing!')}else say(pick(PRAISE));
if(pos==N){render();await win();return}render();await sleep(500)}
async function onWrong(){bad++;mood('surprised');const a=pos,b=pos+1,mx=PX[a]+(PX[b]-PX[a])*.62,my=PY[b]-5;
setTimeout(sfx.jump,230);await leap(PX[a],PY[a],PK[a],mx,my,0,680,{fall:true});$('shd').style.opacity=0;sfx.splash();splash(mx,my+4);
const an=FI.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${sc.clientHeight*.15}px) rotate(200deg)`,opacity:0}],{duration:600,fill:'forwards'});
say(pick(OOPS),1);render();await sleep(1100);an.cancel();restPose();F.style.transition='none';stop(a);F.offsetWidth;F.style.transition='';FI.animate([{transform:'scale(0)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:450});await sleep(600);mood('happy')}
async function celebrate(){const x0=PX[N+1],y0=PY[N+1],k0=PK[N+1],xs=[0,-2,0,-2.2,0,0],hs=[.2,.24,.3,.26,.4],ds=[640,640,820,660,920];
sfx.win();burst(45);startParty();confetti(70);
for(let j=0;j<5;j++){mood('excited');setTimeout(sfx.jump,200);await leap(x0+xs[j],y0,k0,x0+xs[j+1],y0,k0,ds[j],{h:hs[j],flip:j==2||j==4});sfx.land();burst(8);if(j%2==0)confetti(28);await sleep(110)}
await sleep(450)}
async function win(){mood('excited');await hop(N+1);await celebrate();playing=false;
$('wt').textContent=`Correct answers: ${ok}  •  Incorrect attempts: ${bad}`;$('wst').textContent='⭐'.repeat(Math.floor(sessOk/5))||'☆';$('win').classList.remove('hide');render();ctrls()}
$('bc').onclick=()=>run(onCorrect);$('bw').onclick=()=>run(onWrong);
$('zoom').onclick=hideZoom;
function togglePause(){if(busy||!playing)return;paused=!paused;$('pause').classList.toggle('hide',!paused);ctrls()}
$('resume').onclick=togglePause;
/* ---- teacher setup ---- */
const KEY='froggy-setup-v2',DEF={text:'ا ب ت ث ج ح خ د ذ ر',split:false,shuf:true,per:10};
let cur={...DEF},started=false,from=null,wasPaused=false;
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o)Object.assign(cur,o);else{const v=JSON.parse(localStorage.getItem('froggy-setup-v1')||'null');if(v)Object.assign(cur,v,{per:10})}}catch(e){}
function parse(t,sp){const a=sp?(t.match(/\p{L}[\p{M}\u0640]*/gu)||[]):t.split(/[\s,،;؛]+/).filter(Boolean);return[...new Set(a)]}
let POOL=parse(cur.text,cur.split);if(!POOL.length){cur={...DEF};POOL=parse(cur.text,false)}
function form(){return{text:$('txt').value,split:$('split').checked,shuf:$('shuf').checked,per:Math.max(1,Math.min(10,parseInt($('per').value)||10))}}
function chips(){const f=form(),a=parse(f.text,f.split),c=$('chips');c.textContent='';a.slice(0,60).forEach(x=>c.append(el('i','',x)));if(a.length>60)c.append(el('i','','+'+(a.length-60)));
$('cnt').textContent=a.length?`${a.length} item${a.length>1?'s':''} found • ${f.per} pads per round${a.length<f.per?' (items repeat to fill the pads)':''}`:'No items yet';$('serr').textContent=''}
function fill(s){$('txt').value=s.text;$('split').checked=!!s.split;$('shuf').checked=s.shuf!==false;$('per').value=s.per||7;chips()}
['txt','split','shuf','per'].forEach(i=>['input','change'].forEach(e=>$(i).addEventListener(e,chips)));
function apply(){const f=form(),a=parse(f.text,f.split);if(!a.length){$('serr').textContent='Please write at least one letter or word. • اكتب حرف أو كلمة على الأقل';return false}
cur=f;POOL=a;try{localStorage.setItem(KEY,JSON.stringify(f))}catch(e){}return true}
function openSetup(src){stopParty();from=src;wasPaused=paused;if(src=='game'){paused=true;ctrls()}fill(cur);['pause','win'].forEach(i=>$(i).classList.add('hide'));
$('setcancel').hidden=!started;$('start').textContent=started?'SAVE & PLAY':'START GAME';$('welcome').classList.remove('hide')}
$('edt').onclick=()=>{if(!busy)openSetup('game')};$('chg').onclick=()=>openSetup('win');
$('setcancel').onclick=()=>{$('welcome').classList.add('hide');if(from=='win')$('win').classList.remove('hide');else{paused=wasPaused;$('pause').classList.toggle('hide',!paused);ctrls()}};
$('start').onclick=()=>{if(!apply())return;ac();newRound()};$('again').onclick=()=>{ac();newRound()};
fill(cur);N=cur.per;buildPads(N);render();ctrls();stop(0);
try{document.fonts.load('700 40px Amiri','ابت ًٌٍَُِّْ').then(()=>{fitC.clear();render()});document.fonts.ready.then(()=>{fitC.clear();render()})}catch(e){}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(busy)return;buildPads(N);render();stop(at)},150)});
</script></body></html>
